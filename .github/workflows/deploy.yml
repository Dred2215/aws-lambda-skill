name: Deploy para AWS Lambda

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install --production

      - name: Empacotar função
        run: zip -r function.zip src/ node_modules/ package.json

      - name: Configurar AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Deploy na Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ github.ref_name == 'main' && 'alexa-skill-handler' || 'alexa-skill-handler-dev' }} \
            --zip-file fileb://function.zip

      - name: Atualizar VPS_URL na Lambda
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ github.ref_name == 'main' && 'alexa-skill-handler' || 'alexa-skill-handler-dev' }} \
            --environment "Variables={VPS_URL=${{ github.ref_name == 'main' && secrets.VPS_URL_PROD || secrets.VPS_URL_DEV }}}"
