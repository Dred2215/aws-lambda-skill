name: Deploy para AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install --production

      - name: Empacotar função
        run: zip -r function.zip src/ node_modules/ package.json

      - name: Configurar AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Deploy na Lambda
        run: |
          aws lambda update-function-code \
            --function-name alexa-skill-handler \
            --zip-file fileb://function.zip

      - name: Atualizar variável VPS_URL
        run: |
          aws lambda update-function-configuration \
            --function-name alexa-skill-handler \
            --environment "Variables={VPS_URL=${{ secrets.VPS_URL }}}"
