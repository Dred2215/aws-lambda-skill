name: Deploy para AWS Lambda

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FUNCTION_NAME: ${{ github.ref_name == 'main' && 'alexa-skill-handler' || 'alexa-skill-handler-dev' }}
      VPS_URL: ${{ github.ref_name == 'main' && secrets.VPS_URL_PROD || secrets.VPS_URL_DEV }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install --production

      - name: Empacotar função
        run: zip -r function.zip src/ node_modules/ package.json

      - name: Configurar AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Deploy na Lambda (${{ github.ref_name }})
        run: |
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://function.zip

      - name: Atualizar variável VPS_URL
        run: |
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --environment "Variables={VPS_URL=$VPS_URL}"
